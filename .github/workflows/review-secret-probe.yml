name: Review Event Fork Secret Semantics

on:
  pull_request_review:
    types: [submitted]

permissions: {}

jobs:
  probe:
    if: github.event.review.state == 'approved'
    runs-on: ubuntu-latest
    steps:
      - name: Check synthetic secret presence
        env:
          PROBE_SECRET: ${{ secrets.PROBE_SECRET }}
        run: |
          echo "actor=${{ github.actor }}"
          echo "association=${{ github.event.review.author_association }}"
          echo "head_repo=${{ github.event.pull_request.head.repo.full_name }}"
          if [ -n "$PROBE_SECRET" ]; then
            echo "secret_present=true"
          else
            echo "secret_present=false"
            exit 17
          fi
